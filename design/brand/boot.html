<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIX Boot Screen</title>
<meta name="description" content="The SIX OS boot screen: the mark's eyes open, the hex band draws itself around them, the wordmark types out and a terminal loader fills. Reference for the Plymouth theme.">
<link rel="icon" href="six-app-icon-small.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=VT323&display=swap">
<style>
/* Reference implementation of the SIX boot screen (design/guide/18-brand.md).
   Timeline, in seconds from power-on:
     0.15–0.60  black power-on frame fades away to cobalt
     0.50–0.95  the eyes pop open (overshoot spring)
     1.00 →     the eyes blink every 4.5 s
     1.30–2.80  the hex band draws itself around them
     2.70 →     terminal cursor blinks
     2.90–3.52  S I X, then O S, type one letter at a time
     3.40 →     the wordmark glitches once every 2.8 s (cyan and magenta slices)
     3.80–5.50  the loader runs; the status line types out
     6.30       the screen fades to the session (or the Plymouth theme hands over to the greeter) */
:root {
  --brand: #1b3cff; --brand-ink: #c9d3ff;
  --font-pixel: "VT323", "JetBrains Mono", monospace;
  --font-ui: "JetBrains Mono", ui-monospace, monospace;
}
html, body { height: 100%; margin: 0; }
body { background: var(--brand); color: #fff; font: 400 18px/1 var(--font-pixel); overflow: hidden; }
.stage { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform: translate(-50%, -50%) scale(var(--bs, 1)); }
.markbox { position: absolute; inset: 0; padding-bottom: 120px; display: flex; align-items: center; justify-content: center; }
.markbox svg { width: 260px; height: 260px; overflow: visible; }
.low { position: absolute; left: 0; right: 0; bottom: 64px; display: flex; flex-direction: column; align-items: center; gap: 24px; }
.word { display: flex; align-items: flex-end; height: 72px; line-height: 1; }
.six { font-size: 72px; line-height: 1; white-space: nowrap; }
.os { font-size: 26px; line-height: 1; margin: 0 0 5px 16px; color: var(--brand-ink); white-space: nowrap; }
.cur { display: inline-block; width: 16px; height: 30px; margin: 0 0 3px 10px; background: #fff; opacity: 0; animation: cur 1s steps(1) 2.7s infinite; }
.load { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.say { height: 22px; font-size: 18px; color: var(--brand-ink); }
.say span { display: inline-block; overflow: hidden; white-space: nowrap; width: 0; animation: say 1.3s steps(var(--n)) 3.8s forwards; }
.power { position: absolute; inset: 0; background: #000; animation: fade 0.45s ease-out 0.15s forwards; }
.draw { stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 1.5s cubic-bezier(0.65, 0, 0.35, 1) 1.3s forwards; }
.pop { transform-box: fill-box; transform-origin: center; transform: scale(0); animation: pop 0.45s cubic-bezier(0.3, 1.6, 0.5, 1) 0.5s forwards; }
.blink { transform-box: fill-box; transform-origin: center; animation: blink 4.5s 1s infinite; }
.ch { display: inline-block; overflow: hidden; width: 0; white-space: nowrap; vertical-align: bottom; animation: type 0.01s steps(1) forwards; }
.glitch { position: relative; display: inline-block; animation: jit 2.8s 3.4s infinite; }
.glitch::before, .glitch::after { content: attr(data-text); position: absolute; left: 0; top: 0; opacity: 0; pointer-events: none; }
.glitch::before { color: #4df3ff; animation: gA 2.8s 3.4s infinite; }
.glitch::after { color: #ff3e9a; animation: gB 2.8s 3.4s infinite; }
.term { display: flex; align-items: center; gap: 10px; font-size: 26px; line-height: 1; }
.bars { display: flex; gap: 4px; }
.bars > i { width: 6px; height: 16px; background: rgba(255, 255, 255, 0.22); }
.bars > i::after { content: ""; display: block; width: 100%; height: 100%; background: #fff; opacity: 0; animation: on 0.01s steps(1) var(--d) forwards; }
.scan { position: relative; width: 280px; height: 3px; border-radius: 2px; overflow: hidden; background: rgba(255, 255, 255, 0.22); }
.scan i { position: absolute; left: 0; top: 0; width: 80px; height: 100%; background: #fff; transform: translateX(-80px); animation: sweep 0.7s ease-in-out 3.8s 2 both; }
.scan b { position: absolute; inset: 0; background: #fff; transform: scaleX(0); transform-origin: left center; animation: fill 0.9s cubic-bezier(0.65, 0, 0.35, 1) 5.2s forwards; }
@property --p { syntax: '<integer>'; inherits: false; initial-value: 0; }
.pct { font-size: 26px; line-height: 1; counter-reset: p var(--p); animation: pct 2.2s cubic-bezier(0.4, 0, 0.2, 1) 3.8s forwards; }
.pct::after { content: "> " counter(p) "%"; }
.hexes { display: flex; gap: 12px; }
.hexes svg { width: 24px; height: 24px; }
.hexes .hx { transform-box: fill-box; transform-origin: center; transform: scale(0); animation: pop 0.32s cubic-bezier(0.3, 1.6, 0.5, 1) var(--d) forwards; }
@keyframes fade { to { opacity: 0; visibility: hidden; } }
@keyframes pop { to { transform: scale(1); } }
@keyframes blink { 0%, 100% { transform: scaleY(1); } 4% { transform: scaleY(0.1); } 8% { transform: scaleY(1); } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes cur { 0%, 49.9% { opacity: 1; } 50%, 100% { opacity: 0; } }
@keyframes type { from, to { width: 1ch; } }
@keyframes on { from, to { opacity: 1; } }
@keyframes say { to { width: calc(var(--n) * 1ch); } }
@keyframes sweep { from { transform: translateX(-80px); } to { transform: translateX(280px); } }
@keyframes fill { to { transform: scaleX(1); } }
@keyframes pct { to { --p: 100; } }
@keyframes jit { 0%, 7%, 100% { transform: none; opacity: 1; } 1% { transform: translate(-3px, 1px) skewX(-10deg); } 2% { transform: translate(3px, -1px); opacity: 0.75; } 3% { transform: translate(-1px, 0) skewX(6deg); opacity: 1; } 5% { transform: translate(2px, 1px); } 6% { transform: none; } }
@keyframes gA { 0% { opacity: 0.9; transform: translate(-6px, 0); clip-path: inset(8% 0 62% 0); } 2% { opacity: 0.9; transform: translate(4px, 0); clip-path: inset(55% 0 18% 0); } 4% { opacity: 0.9; transform: translate(-3px, 0); clip-path: inset(30% 0 45% 0); } 6% { opacity: 0.9; transform: translate(6px, 0); clip-path: inset(78% 0 4% 0); } 7%, 100% { opacity: 0; transform: none; clip-path: inset(0 0 100% 0); } }
@keyframes gB { 0% { opacity: 0.9; transform: translate(5px, 0); clip-path: inset(60% 0 12% 0); } 2% { opacity: 0.9; transform: translate(-5px, 0); clip-path: inset(12% 0 70% 0); } 4% { opacity: 0.9; transform: translate(3px, 0); clip-path: inset(40% 0 38% 0); } 6% { opacity: 0.9; transform: translate(-4px, 0); clip-path: inset(2% 0 85% 0); } 7%, 100% { opacity: 0; transform: none; clip-path: inset(0 0 100% 0); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; }
  .power, .scan i { display: none; }
  .draw { stroke-dashoffset: 0; } .pop, .hx { transform: none; }
  .cur, .bars > i::after { opacity: 1; } .ch { width: 1ch; }
  .say span { width: calc(var(--n) * 1ch); } .scan b { transform: none; } .pct { --p: 100; }
}
.controls { position: absolute; right: 20px; top: 16px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; max-width: calc(100% - 40px); font: 500 13px/1 var(--font-ui); letter-spacing: 0.02em; }
.controls button { min-height: 36px; padding: 8px 14px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.55); background: transparent; color: #fff; font: inherit; cursor: pointer; }
.controls button[aria-pressed="true"] { background: #fff; color: var(--brand); }
.controls button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
</style>
</head>
<body>
<div id="screen" role="img" aria-label="SIX boot screen: the mark's eyes open, the hex band draws around them, SIX OS types out and a loader fills"></div>
<div class="controls" role="group" aria-label="Boot screen options">
  <button type="button" data-l="terminal" aria-pressed="true">Terminal</button>
  <button type="button" data-l="scan" aria-pressed="false">Scan</button>
  <button type="button" data-l="counter" aria-pressed="false">Counter</button>
  <button type="button" data-l="hexagons" aria-pressed="false">Hexagons</button>
  <button type="button" id="replay">Replay</button>
</div>
<script>
const BAND = 'M90.9 -97.5 L0 -150 L-129.9 -75 L-129.9 75 L0 150 L129.9 75 L129.9 -20 L0 -92 L-79.67 -46 L-79.67 46 L0 92 L39.84 69';
const SAY = 'bravo six going dark';
let loader = 'terminal';
function loaderHTML(kind) {
  if (kind === 'scan') return '<div class="scan"><i></i><b></b></div>';
  if (kind === 'counter') return '<div class="pct"></div>';
  if (kind === 'hexagons') return '<div class="hexes">' + [0, 1, 2, 3, 4, 5].map(i => `<svg viewBox="-12 -12 24 24"><polygon points="0,-10 8.66,-5 8.66,5 0,10 -8.66,5 -8.66,-5" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.6"/><polygon class="hx" style="--d:${(3.8 + i * 0.28).toFixed(2)}s" points="0,-7 6.06,-3.5 6.06,3.5 0,7 -6.06,3.5 -6.06,-3.5" fill="#fff"/></svg>`).join('') + '</div>';
  // 20 cells switching on at a slightly uneven pace, like real work
  let t = 3.8, cells = '';
  for (let i = 0; i < 20; i++) { cells += `<i style="--d:${t.toFixed(2)}s"></i>`; t += 0.035 + ((i * 37) % 7) * 0.016; }
  return `<div class="term"><span>[</span><div class="bars">${cells}</div><span>]</span></div>`;
}
function play() {
  const ch = (txt, t0) => [...txt].map((c, i) => `<span class="ch" style="animation-delay:${(t0 + i * 0.12).toFixed(2)}s">${c}</span>`).join('');
  document.getElementById('screen').innerHTML = `<div class="stage" aria-hidden="true">
    <div class="markbox"><svg viewBox="-200 -200 400 400"><path class="draw" pathLength="100" d="${BAND}" fill="none" stroke="#fff" stroke-width="34" stroke-linejoin="miter" stroke-miterlimit="4"/><g class="pop"><circle class="blink" cx="-24" cy="4" r="14" fill="#fff"/><circle class="blink" cx="24" cy="4" r="14" fill="#fff"/></g></svg></div>
    <div class="low">
      <div class="word"><span class="glitch six" data-text="SIX">${ch('SIX', 2.9)}</span><span class="os">${ch('OS', 3.4)}</span><span class="cur"></span></div>
      <div class="load">${loaderHTML(loader)}<div class="say" style="--n:${SAY.length}"><span>${SAY}</span></div></div>
    </div>
    <div class="power"></div>
  </div>`;
}
const fit = () => document.documentElement.style.setProperty('--bs', Math.min(innerWidth / 560, innerHeight / 720, 1.6).toFixed(3));
addEventListener('resize', fit); fit();
document.querySelector('.controls').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.l) { loader = b.dataset.l; document.querySelectorAll('[data-l]').forEach(x => x.setAttribute('aria-pressed', x === b)); }
  play();
});
play();
</script>
</body>
</html>
